name: Production hardening patch

on:
  push:
    branches: [agent/production-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: !contains(github.event.head_commit.message, '[skip-hardening]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply safe patches
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          # 1) Remove the duplicate public School Life admin entry point from App.
          app = root / 'src/components/placeholder.txt'
          app = root / 'src/App.tsx'
          text = app.read_text(encoding='utf-8')
          text = text.replace("import SchoolLifeAdmin from './components/SchoolLifeAdmin';\n", '')
          text = text.replace("  const [isSchoolLifeAdminOpen, setIsSchoolLifeAdminOpen] = useState(false);\n", '')
          text = re.sub(r'\n      <button onClick=\{\(\) => setIsSchoolLifeAdminOpen\(true\)\}[\s\S]*?</button>', '', text, count=1)
          text = re.sub(r'\n      \{isSchoolLifeAdminOpen && <SchoolLifeAdmin onClose=\{\(\) => setIsSchoolLifeAdminOpen\(false\)\} />\}', '', text)
          app.write_text(text, encoding='utf-8')

          # 2) Put School Life + SchoolCoin entry points inside Cloud Admin.
          cloud = root / 'src/components/CloudAdminPanel.tsx'
          text = cloud.read_text(encoding='utf-8')
          text = text.replace("import { LogIn, LogOut, X, Trash2, RefreshCw, ShieldCheck, AlertTriangle, Upload, Pencil, Plus, Save } from 'lucide-react';\n", "import { LogIn, LogOut, X, Trash2, RefreshCw, ShieldCheck, AlertTriangle, Upload, Pencil, Plus, Save, BedDouble, Coins } from 'lucide-react';\nimport SchoolLifeAdmin from './SchoolLifeAdmin';\nimport SchoolCoin from './SchoolCoin';\n")
          text = text.replace("  const [data,setData]=useState<Record<Key,any[]>>(defaults),[editingId,setEditingId]=useState<string|number|null>(null),[form,setForm]=useState<Record<string,any>>({}),[notice,setNotice]=useState(''),[messages,setMessages]=useState<any[]>([]);", "  const [data,setData]=useState<Record<Key,any[]>>(defaults),[editingId,setEditingId]=useState<string|number|null>(null),[form,setForm]=useState<Record<string,any>>({}),[notice,setNotice]=useState(''),[messages,setMessages]=useState<any[]>([]);\n  const [embeddedPanel,setEmbeddedPanel]=useState<'schoolLife'|'schoolCoin'|null>(null);")
          old = '<div className="flex gap-2"><button onClick={()=>void load()} className="p-2 rounded-xl bg-slate-100" title="Yangilash">'
          new = '<div className="flex flex-wrap justify-end gap-2"><button onClick={()=>setEmbeddedPanel(\'schoolLife\')} className="hidden items-center gap-2 rounded-xl bg-blue-50 px-3 py-2 text-sm font-semibold text-blue-700 sm:inline-flex" title="Maktab hayoti"><BedDouble className="h-4 w-4"/> Maktab hayoti</button><button onClick={()=>setEmbeddedPanel(\'schoolCoin\')} className="hidden items-center gap-2 rounded-xl bg-amber-50 px-3 py-2 text-sm font-semibold text-amber-700 sm:inline-flex" title="SchoolCoin"><Coins className="h-4 w-4"/> SchoolCoin</button><button onClick={()=>setEmbeddedPanel(\'schoolLife\')} className="p-2 rounded-xl bg-blue-50 text-blue-700 sm:hidden" title="Maktab hayoti" aria-label="Maktab hayoti"><BedDouble className="h-4 w-4"/></button><button onClick={()=>setEmbeddedPanel(\'schoolCoin\')} className="p-2 rounded-xl bg-amber-50 text-amber-700 sm:hidden" title="SchoolCoin" aria-label="SchoolCoin"><Coins className="h-4 w-4"/></button><button onClick={()=>void load()} className="p-2 rounded-xl bg-slate-100" title="Yangilash">'
          if old not in text:
              raise SystemExit('CloudAdmin header anchor not found')
          text = text.replace(old, new, 1)
          anchor = '</main></div>;\n}\n'
          injected = "</main>{embeddedPanel === 'schoolLife' && <SchoolLifeAdmin onClose={() => setEmbeddedPanel(null)} />}{embeddedPanel === 'schoolCoin' && <SchoolCoin onClose={() => setEmbeddedPanel(null)} initialMode=\"admin\" adminSession={session} />}</div>;\n}\n"
          if anchor not in text:
              raise SystemExit('CloudAdmin render anchor not found')
          text = text.replace(anchor, injected, 1)
          cloud.write_text(text, encoding='utf-8')

          # 3) SchoolCoin: reuse the already-authenticated Cloud Admin session and secure student order loading through RPC.
          coin = root / 'src/components/SchoolCoin.tsx'
          text = coin.read_text(encoding='utf-8')
          text = text.replace('interface Props {\n  onClose: () => void;\n}', 'interface Props {\n  onClose: () => void;\n  initialMode?: \'student\' | \'admin\';\n  adminSession?: any;\n}')
          text = text.replace('export default function SchoolCoin({ onClose }: Props) {\n  const [mode, setMode] = useState<\'student\' | \'admin\'>(\'student\');', 'export default function SchoolCoin({ onClose, initialMode = \'student\', adminSession: initialAdminSession = null }: Props) {\n  const [mode, setMode] = useState<\'student\' | \'admin\'>(initialMode);')
          text = text.replace("  const [adminSession, setAdminSession] = useState<any>(null);", "  const [adminSession, setAdminSession] = useState<any>(initialAdminSession);")
          load_student = re.compile(r"  const loadStudent = async \(s: Student\) => \{[\s\S]*?\n  \};\n\n  const login = async", re.M)
          replacement = "  const loadStudent = async (_s: Student) => {\n    const { data, error } = await supabase.rpc('schoolcoin_student_orders', {\n      p_code: code,\n      p_pin: pin,\n    });\n\n    if (error) {\n      setError(error.message);\n      return;\n    }\n\n    setOrders((data || []).map((order: any) => ({\n      ...order,\n      schoolcoin_market_rewards: { title: order.reward_title },\n    })));\n  };\n\n  const login = async"
          text, n = load_student.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit('SchoolCoin loadStudent anchor not found')
          text = text.replace("  const flash = (message: string) => {", "  useEffect(() => {\n    if (initialAdminSession) setAdminSession(initialAdminSession);\n  }, [initialAdminSession]);\n\n  const flash = (message: string) => {", 1)
          coin.write_text(text, encoding='utf-8')

          # 4) Reduce motion for accessibility and performance-sensitive devices.
          css = root / 'src/index.css'
          text = css.read_text(encoding='utf-8')
          if '@media (prefers-reduced-motion: reduce)' not in text:
              text += "\n\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.01ms !important;\n    scroll-behavior: auto !important;\n  }\n}\n"
          text = text.replace('      transition-all\n      duration-700', '      transition-[transform,background-color,box-shadow]\n      duration-500', 1)
          css.write_text(text, encoding='utf-8')

          # Ensure the App no longer references the removed duplicate state/import.
          final_app = app.read_text(encoding='utf-8')
          if 'SchoolLifeAdmin' in final_app or 'isSchoolLifeAdminOpen' in final_app:
              raise SystemExit('Duplicate School Life admin entry point still present in App.tsx')

      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/CloudAdminPanel.tsx src/components/SchoolCoin.tsx src/index.css
          git commit -m "Harden admin integration and SchoolCoin security [skip-hardening]" || exit 0
          git push origin HEAD:agent/production-hardening
