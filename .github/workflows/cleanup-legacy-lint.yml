name: Cleanup legacy lint

on:
  push:
    branches: [agent/production-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: !contains(github.event.head_commit.message, '[skip-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch legacy any and unused import
        shell: python
        run: |
          from pathlib import Path

          files = {
            'src/components/Administration.tsx': [
              ('type AdministrationMember = { id?: string | number; name?: string; image?: string; role?: string; position?: string; reception?: string; phone?: string };\n', 'type AdministrationMember = { id?: string | number; name?: string; image?: string; role?: string; position?: string; reception?: string; phone?: string };\n'),
              ('import { administration as staticAdministration } from \'../lib/data\';\n', 'import { administration as staticAdministration } from \'../lib/data\';\n\ntype AdministrationMember = { id?: string | number; name?: string; image?: string; role?: string; position?: string; reception?: string; phone?: string };\n'),
              ('useState<any[]>([])', 'useState<AdministrationMember[]>([])'),
              ('(person: any, index: number)', '(person: AdministrationMember, index: number)'),
            ],
            'src/components/Innovation.tsx': [
              ('import { useScrollAnimation, useCountUp } from \'../hooks/useScrollAnimation\';\n', 'import { useScrollAnimation, useCountUp } from \'../hooks/useScrollAnimation\';\n\ntype InnovationProject = { id?: string | number; title?: string; image?: string; status?: string; goal?: string; participants?: string | number; description?: string };\n'),
              ('useState<any[]>([])', 'useState<InnovationProject[]>([])'),
            ],
            'src/components/VideoLessons.tsx': [
              ('import { useScrollAnimation } from \'../hooks/useScrollAnimation\';\n', 'import { useScrollAnimation } from \'../hooks/useScrollAnimation\';\n\ntype VideoLesson = { id?: string | number; title?: string; url?: string; youtubeId?: string; thumbnail?: string; image?: string; subject?: string; duration?: string; teacher?: string; description?: string };\n'),
              ('useState<any[]>([])', 'useState<VideoLesson[]>([])'),
              ("getSiteData<any[]>('videoLessons', [])", "getSiteData<VideoLesson[]>('videoLessons', [])"),
              ('(v: any, index: number)', '(v: VideoLesson, index: number)'),
            ],
            'src/components/SchoolCoinSecure.tsx': [
              ('  Package,\n', ''),
            ],
          }

          for filename, replacements in files.items():
            path = Path(filename)
            text = path.read_text(encoding='utf-8')
            original = text
            for old, new in replacements:
              if old not in text:
                raise SystemExit(f'Expected anchor not found in {filename}: {old!r}')
              text = text.replace(old, new, 1)
            path.write_text(text, encoding='utf-8')
            if text == original:
              raise SystemExit(f'No change made to {filename}')

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Administration.tsx src/components/Innovation.tsx src/components/VideoLessons.tsx src/components/SchoolCoinSecure.tsx
          git commit -m "Clean legacy TypeScript lint issues [skip-cleanup]" || exit 0
          git push origin HEAD:agent/production-hardening
